name: release-aarch64-linux

on:
  push:
    tags:
      - '*'

env:
  LIBTORCH_VERSION: 2.8.0
  TORCHVISION_VERSION: 0.23.0
  PROTOBUF_VERSION: 21.12
  ONNXRUNTIME_VERSION: 1.22.1
  CACHE_DATE: 20250818

permissions:
  contents: read

jobs:
  setup:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
    - name: get-version
      id: get_version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  aarch64-deps:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: pnnx-patches
      uses: actions/checkout@v5
      with:
        path: pnnx-patches
        
    - name: install-build-deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake wget zip unzip git ninja-build
        
    - name: cache-libtorch
      id: cache-libtorch
      uses: actions/cache@v4.2.4
      with:
        path: "/tmp/libtorch"
        key: libtorch-${{ env.LIBTORCH_VERSION }}-linux-aarch64-shared-${{ env.CACHE_DATE }}
    - name: cache-torchvision
      id: cache-torchvision
      uses: actions/cache@v4.2.4
      with:
        path: "/tmp/torchvision"
        key: torchvision-${{ env.TORCHVISION_VERSION }}-linux-aarch64-shared-${{ env.CACHE_DATE }}
    - name: cache-onnxruntime
      id: cache-onnxruntime
      uses: actions/cache@v4.2.4
      with:
        path: "/tmp/onnxruntime"
        key: onnxruntime-${{ env.ONNXRUNTIME_VERSION }}-linux-aarch64-static-${{ env.CACHE_DATE }}

    # Usar libtorch compartilhado para acelerar build
    - name: download-libtorch-shared
      if: steps.cache-libtorch.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/libtorch
        cd /tmp/libtorch
        # Download libtorch pré-compilado para ARM64
        wget -q https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-${{ env.LIBTORCH_VERSION }}%2Bcpu.zip -O libtorch.zip
        unzip -q libtorch.zip
        # Aplicar patches necessários
        cd libtorch
        # Se precisar de patches específicos, aplicar aqui

    # Build torchvision compartilhado
    - name: build-torchvision-shared
      if: steps.cache-torchvision.outputs.cache-hit != 'true'
      run: |
        wget -q https://github.com/pytorch/vision/archive/refs/tags/v${{ env.TORCHVISION_VERSION }}.zip -O vision-${{ env.TORCHVISION_VERSION }}.zip
        unzip -q vision-${{ env.TORCHVISION_VERSION }}.zip
        cd vision-${{ env.TORCHVISION_VERSION }}
        patch -p1 -i $GITHUB_WORKSPACE/pnnx-patches/vision-${{ env.TORCHVISION_VERSION }}-ops-only.patch
        patch -p1 -i $GITHUB_WORKSPACE/pnnx-patches/vision-${{ env.TORCHVISION_VERSION }}-no-cuda-version.patch
        mkdir -p build && cd build
        cmake -DCMAKE_INSTALL_PREFIX="/tmp/torchvision" \
              -DTorch_DIR="/tmp/libtorch/share/cmake/Torch" \
              -DCMAKE_BUILD_TYPE=Release \
              -DWITH_PNG=OFF \
              -DWITH_JPEG=OFF \
              ..
        cmake --build . -j $(nproc)
        cmake --build . --target install/strip

    # Build ONNX Runtime estático (necessário para binário final estático)
    - name: build-onnxruntime-static
      if: steps.cache-onnxruntime.outputs.cache-hit != 'true'
      run: |
        # Build protobuf static
        wget -q https://github.com/protocolbuffers/protobuf/archive/v${{ env.PROTOBUF_VERSION }}.zip -O protobuf-${{ env.PROTOBUF_VERSION }}.zip
        unzip -q protobuf-${{ env.PROTOBUF_VERSION }}.zip
        cd protobuf-${{ env.PROTOBUF_VERSION }}
        mkdir -p build && cd build
        cmake -DCMAKE_INSTALL_PREFIX="/tmp/onnxruntime" \
              -Dprotobuf_BUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              ..
        cmake --build . -j $(nproc)
        cmake --build . --target install/strip
        cd ../../
        
        # Build ONNX Runtime static
        wget -q https://github.com/microsoft/onnxruntime/archive/v${{ env.ONNXRUNTIME_VERSION }}.zip -O onnxruntime-${{ env.ONNXRUNTIME_VERSION }}.zip
        unzip -q onnxruntime-${{ env.ONNXRUNTIME_VERSION }}.zip
        cd onnxruntime-${{ env.ONNXRUNTIME_VERSION }}
        patch -p1 -i $GITHUB_WORKSPACE/pnnx-patches/onnxruntime-${{ env.ONNXRUNTIME_VERSION }}-less-mlas-features.patch
        patch -p1 -i $GITHUB_WORKSPACE/pnnx-patches/onnxruntime-${{ env.ONNXRUNTIME_VERSION }}-monolithic-static-library.patch
        patch -p1 -i $GITHUB_WORKSPACE/pnnx-patches/onnxruntime-${{ env.ONNXRUNTIME_VERSION }}-use-clog.patch
        mkdir -p build && cd build
        cmake -DCMAKE_INSTALL_PREFIX="/tmp/onnxruntime" \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -Donnxruntime_USE_FULL_PROTOBUF=ON \
              -Donnxruntime_BUILD_SHARED_LIB=OFF \
              -Donnxruntime_BUILD_UNIT_TESTS=OFF \
              -Donnxruntime_ENABLE_CPUINFO=OFF \
              -Donnxruntime_DISABLE_CONTRIB_OPS=ON \
              -Donnxruntime_DISABLE_ML_OPS=ON \
              -Donnxruntime_DISABLE_SPARSE_TENSORS=ON \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              ../cmake
        cmake --build . -j $(nproc)
        cmake --build . --target install/strip

  build-pnnx-static:
    needs: [setup, aarch64-deps]
    runs-on: ubuntu-24.04-arm
    env:
      PACKAGENAME: pnnx-${{ needs.setup.outputs.VERSION }}-linux-aarch64-static
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: pnnx-patches
      uses: actions/checkout@v5
      with:
        path: pnnx-patches
        
    - name: install-build-deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake wget zip unzip git
        
    - name: checkout-ncnn
      uses: actions/checkout@v5
      with:
        repository: Tencent/ncnn
        path: ncnn

    # Build PNNX com link estático apenas para ONNX Runtime
    - name: build-pnnx-static-binary
      run: |
        cd ncnn/tools/pnnx/
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/tmp/install \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DTorch_INSTALL_DIR="/tmp/libtorch" \
              -DTorchVision_INSTALL_DIR="/tmp/torchvision" \
              -Donnxruntime_INSTALL_DIR="/tmp/onnxruntime" \
              -DProtobuf_INCLUDE_DIR="/tmp/onnxruntime/include" \
              -DProtobuf_LIBRARIES="/tmp/onnxruntime/lib/libprotobuf.a" \
              -DProtobuf_PROTOC_EXECUTABLE="/tmp/onnxruntime/bin/protoc" \
              ..
        cmake --build . -j $(nproc)
        cmake --build . --target install/strip

    - name: package-static-binary
      run: |
        mkdir ${{ env.PACKAGENAME }}
        cp $GITHUB_WORKSPACE/pnnx-patches/README.md ${{ env.PACKAGENAME }}
        cp /tmp/install/bin/pnnx ${{ env.PACKAGENAME }}
        chmod +x ${{ env.PACKAGENAME }}/pnnx
        zip -9 -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}
        
    - name: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip

  release-aarch64:
    permissions:
      contents: write
    needs: [setup, build-pnnx-static]
    runs-on: ubuntu-latest
    steps:
    - name: download-static-binary
      uses: actions/download-artifact@v5
      with:
        name: pnnx-${{ needs.setup.outputs.VERSION }}-linux-aarch64-static
        path: artifacts
        
    - name: create-release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ needs.setup.outputs.VERSION }}
        name: Release ${{ needs.setup.outputs.VERSION }} - AArch64 Static Binary
        files: artifacts/*.zip
